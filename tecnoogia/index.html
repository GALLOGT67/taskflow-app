<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Bienvenido a TaskFlow</h1>

    <!-- LOGIN -->
    <section class="login">
        <h2>Iniciar Sesión</h2>

        <p>Accede a tu cuenta TaskFlow</p>

        <form>
            <input type="email" placeholder="Correo">
            <input type="password" placeholder="Contraseña">

            <button type="submit">
                Ingresar
            </button>
        </form>
    </section>

    <!-- DASHBOARD -->
    <section class="dashboard">
        <h2>Dashboard</h2>

       <h1>TaskFlow Header Oficial</h1>

        <ul>
            <li>Tarea pendiente</li>
            <li>Reunión del equipo</li>
            <li>Entrega de proyecto</li>
        </ul>
    </section>

    <script src="app.js"></script>

</body>
</html>
